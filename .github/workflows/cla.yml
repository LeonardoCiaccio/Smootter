name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    name: CLA Assistant
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read and agree to the Smootter CLA (CLA.md).') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/LeonardoCiaccio/Smootter/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: LeonardoCiaccio
          custom-pr-sign-comment: 'I have read and agree to the Smootter CLA (CLA.md).'
          custom-notsigned-prcomment: |
            Thanks for the contribution! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/LeonardoCiaccio/Smootter/blob/main/CLA.md)
            and reply with:

            > I have read and agree to the Smootter CLA (CLA.md).
